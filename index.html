<title>Wayfarer Trip Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column wizard — stepper on top, the current stage below, trip ticket at the end */
:root {
  --bg: #eef2f4; --surface: #ffffff; --sunk: #e3e9ec; --ink: #142a33; --muted: #56707a; --line: #cfd9dd;
  --accent: #0b6e69; --accent-ink: #ffffff; --accent-soft: #d5ece9;
  --stamp: #b5571c; --stamp-soft: #f6e3d6;
  --good: #2f7d32; --warn: #a8620a; --bad: #b3261e;
  --shadow: 0 1px 2px rgb(20 42 51 / .06), 0 6px 20px rgb(20 42 51 / .06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a1f; --surface: #15252b; --sunk: #1b2f36; --ink: #e4eef0; --muted: #93abb3; --line: #2a4149;
    --accent: #4fc2b8; --accent-ink: #062523; --accent-soft: #173d3b; --stamp: #f0965c; --stamp-soft: #3a2619;
    --good: #7cc47f; --warn: #e6a74a; --bad: #f08a80;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a1f; --surface: #15252b; --sunk: #1b2f36; --ink: #e4eef0; --muted: #93abb3; --line: #2a4149;
  --accent: #4fc2b8; --accent-ink: #062523; --accent-soft: #173d3b; --stamp: #f0965c; --stamp-soft: #3a2619;
  --good: #7cc47f; --warn: #e6a74a; --bad: #f08a80;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 20px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; color: var(--accent); }
.brand h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.brand small { display: block; font: 500 11px/1.2 var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.saved { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.saved label { font-size: 13px; color: var(--muted); }
.saved select { max-width: 230px; }

/* Stepper */
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 720px) { .stepper { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.step button { width: 100%; text-align: left; display: grid; gap: 2px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-width: 0; }
.step button[disabled] { cursor: not-allowed; opacity: .55; background: var(--sunk); }
.step .n { font: 700 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.step .l { font: 700 14px var(--f-display); }
.step .p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.done button .n { color: var(--good); }
.step.cur button { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.step.cur .n { color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); display: grid; gap: 16px; min-width: 0; }
.panel h2 { font-size: 24px; font-weight: 800; letter-spacing: -.015em; }
.lead { margin: 0; color: var(--muted); max-width: 66ch; }
.example-flag { display: inline-flex; font: 700 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--stamp); background: var(--stamp-soft); padding: 6px 9px; border-radius: 999px; justify-self: start; }

/* Form */
.form { display: grid; gap: 16px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.field { display: grid; gap: 5px; min-width: 0; align-content: start; }
.field > span, .legend { font: 700 11px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input[type="text"], input[type="date"], input[type="number"], select, textarea { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
textarea { resize: vertical; min-height: 56px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.money { display: grid; grid-template-columns: 88px 1fr; gap: 8px; }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; justify-self: start; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
.seg input:checked + label { background: var(--surface); box-shadow: var(--shadow); font-weight: 700; color: var(--accent); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); }
.catbud { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.trav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.trav-item { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px 4px 10px; }
.trav-item b { font: 700 11px var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.trav-item input { width: 64px; padding: 5px 6px; }
.x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--bad); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 12px 20px; font-size: 15.5px; }
.btn.primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.missing { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.missing li { font-size: 12.5px; color: var(--warn); background: var(--stamp-soft); border-radius: 999px; padding: 3px 10px; }
.status { font-size: 13px; color: var(--muted); min-height: 1.3em; }
.status.err { color: var(--bad); }
.nights { font: 500 12px var(--f-mono); color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

/* Brief recap strip */
.recap { display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 10px 14px; background: var(--sunk); border-radius: 8px; font-size: 13.5px; align-items: center; }
.recap b { font: 700 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.recap .btn { margin-left: auto; }
.budget-hint { font-size: 13.5px; color: var(--muted); }

/* Comparison table */
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table.cmp { width: 100%; border-collapse: collapse; min-width: 640px; }
.cmp th { text-align: left; font: 700 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--sunk); padding: 10px 12px; }
.cmp td { padding: 12px; vertical-align: top; border-top: 1px solid var(--line); font-size: 14px; }
.cmp tr.sel td { background: var(--accent-soft); }
.cmp .pick { width: 74px; }
.cmp .pick label { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; cursor: pointer; }
.cmp .pick input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
.cmp .name { font: 700 15px/1.3 var(--f-display); }
.cmp .cost { font: 700 14px var(--f-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cmp .pros { color: var(--ink); }
.cmp .cons { color: var(--muted); }
@media (max-width: 720px) {
  .tblwrap { border: 0; overflow: visible; }
  table.cmp, .cmp tbody, .cmp tr, .cmp td { display: block; min-width: 0; width: 100%; }
  .cmp thead { display: none; }
  .cmp tr { border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; background: var(--surface); }
  .cmp td { border-top: 0; padding: 6px 12px; }
  .cmp td[data-label]::before { content: attr(data-label); display: block; font: 700 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cmp .pick { width: auto; padding-top: 10px; }
}
.adjust { display: flex; gap: 8px; flex-wrap: wrap; }
.adjust input { flex: 1 1 260px; }
.note { font-size: 12.5px; color: var(--muted); }

.drafting { display: grid; gap: 10px; border: 1px dashed var(--accent); border-radius: var(--r); padding: 20px; }
.drafting .bigline { font: 700 18px var(--f-display); }
.pulse { height: 4px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.pulse i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
@media (prefers-reduced-motion: reduce) { .pulse i { transition: none; } }

/* Ticket (summary) */
.ticket { display: grid; grid-template-columns: minmax(0, 1fr) 210px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
@media (max-width: 640px) { .ticket { grid-template-columns: minmax(0, 1fr); } }
.ticket-main { padding: 22px 24px; display: grid; gap: 14px; min-width: 0; }
.route { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.code { font: 700 clamp(40px, 7vw, 60px)/0.9 var(--f-mono); letter-spacing: -.02em; color: var(--accent); }
.route h2 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.fact { display: grid; gap: 2px; }
.fact b { font: 700 10.5px/1.2 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.fact span { font-weight: 700; font-variant-numeric: tabular-nums; }
.stub { border-left: 2px dashed var(--line); padding: 22px 18px; display: grid; align-content: space-between; gap: 14px; background: var(--sunk); }
@media (max-width: 640px) { .stub { border-left: 0; border-top: 2px dashed var(--line); } }
.meter-label { font: 700 10.5px var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.total { font: 700 26px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.of { font-size: 13px; color: var(--muted); }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
.meter.over i { background: var(--bad); } .meter.close i { background: var(--warn); }
.verdict { font-size: 13px; font-weight: 700; }
.stamp { justify-self: start; font: 700 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--stamp); border: 2px solid var(--stamp); border-radius: 6px; padding: 6px 8px; transform: rotate(-4deg); }
.over-t { color: var(--bad); font-weight: 700; } .ok-t { color: var(--good); font-weight: 700; }

/* Chat */
.chat { border: 1px solid var(--line); border-radius: var(--r); display: grid; }
.msgs { display: grid; gap: 10px; padding: 14px; max-height: 380px; overflow-y: auto; }
.msg { max-width: 82%; padding: 9px 12px; border-radius: 12px; font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.agent { justify-self: start; background: var(--sunk); border-bottom-left-radius: 4px; }
.msg.hint { justify-self: stretch; max-width: none; background: none; color: var(--muted); font-size: 13.5px; padding: 0; }
.chat form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.chat form input { flex: 1; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px; }
.suggest button { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.suggest button:hover { color: var(--accent); border-color: var(--accent); }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg></div>
      <div><h1>Wayfarer Trip Desk</h1><small>Your AI travel agent</small></div>
    </div>
    <div class="saved">
      <label for="savedSel">Saved trips</label>
      <select id="savedSel"><option value="">None yet</option></select>
      <button class="btn small" id="saveBtn" type="button">Save this trip</button>
      <button class="btn small" id="delBtn" type="button" hidden>Remove</button>
    </div>
  </header>
  <ol class="stepper" id="stepper" aria-label="Trip planning steps"></ol>
  <main id="stage" aria-live="polite"></main>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const STAGES = [
    { key: "flights", label: "Flights", next: "Hotels" },
    { key: "hotels", label: "Hotels", next: "Restaurants" },
    { key: "restaurants", label: "Restaurants", next: "Attractions" },
    { key: "attractions", label: "Attractions", next: "Car rentals / transit" },
    { key: "transit", label: "Car rentals / transit", next: "Trip summary" }
  ];
  const STORE_KEY = "wayfarer.trips.v2";

  // ---------- helpers ----------
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
    return n;
  }
  const iso = (d) => d.toISOString().slice(0, 10);
  const parseDate = (s) => { const [y, m, d] = String(s || "").split("-").map(Number); return y ? new Date(Date.UTC(y, m - 1, d)) : null; };
  const addDays = (d, n) => new Date(d.getTime() + n * 864e5);
  const fmtMoney = (n, cur) => {
    const v = Number(n) || 0;
    try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur || "USD", maximumFractionDigits: 0 }).format(v); }
    catch { return (cur || "") + " " + Math.round(v).toLocaleString(); }
  };
  const fmtShort = (d) => d ? d.toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" }) : "";
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch { return []; } },
    set(v) { try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); return true; } catch { return false; } }
  };
  const today = new Date(Date.UTC(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()));
  const nightsOf = (b) => { const s = parseDate(b.start), e = parseDate(b.end); return s && e ? Math.round((e - s) / 864e5) : NaN; };
  const partyText = (b) => `${b.travelers.length} traveler${b.travelers.length === 1 ? "" : "s"} (ages ${b.travelers.join(", ")})`;
  const catBudget = (b, key) => b.budgetMode === "category" ? Number(b.catBudgets[key]) || 0 : 0;
  const totalBudget = (b) => b.budgetMode === "category" ? STAGES.reduce((a, s) => a + catBudget(b, s.key), 0) : Number(b.budget) || 0;

  // ---------- state ----------
  const blankBrief = () => ({ dest: "", origin: "", start: iso(addDays(today, 30)), end: iso(addDays(today, 34)), cur: "USD", budgetMode: "total", budget: "", catBudgets: { flights: "", hotels: "", restaurants: "", attractions: "", transit: "" }, travelers: [""] });
  let S = null;            // {stage, furthest, brief, options:{}, picks:{}, chat:[], example?, id?}
  let sampleFn = null, ctl = null, busy = false;
  const statusEl = $("#status");
  const setStatus = (m, err) => { statusEl.textContent = m || ""; statusEl.classList.toggle("err", !!err); };

  function exampleState() {
    const s = addDays(today, 30), e = addDays(today, 34);
    return {
      example: true, stage: 1, furthest: 1,
      brief: { dest: "Lisbon, Portugal", origin: "New York", start: iso(s), end: iso(e), cur: "USD", budgetMode: "total", budget: 4000, catBudgets: { flights: "", hotels: "", restaurants: "", attractions: "", transit: "" }, travelers: [34, 36] },
      options: { flights: [
        { name: "TAP Air Portugal, nonstop JFK–LIS (Economy)", cost: 1380, pros: "Nonstop, 6h 40m. Overnight out, arrives mid-morning. Checked bag included.", cons: "Overnight flight means little sleep on day one." },
        { name: "Delta via Paris, JFK–CDG–LIS (Economy)", cost: 1210, pros: "Cheapest of the three. Daytime connection to stretch your legs.", cons: "About 4 hours longer door to door. One connection." },
        { name: "United nonstop EWR–LIS (Premium Economy)", cost: 2150, pros: "More legroom and a lie-flat-ish recline. Nonstop.", cons: "Uses over half the budget on the flights alone." }
      ] },
      picks: {}, chat: []
    };
  }

  // ---------- stepper ----------
  function renderStepper() {
    const box = $("#stepper"); box.replaceChildren();
    const items = [{ label: "Trip brief", n: "Start" }, ...STAGES.map((s, i) => ({ label: s.label, n: "Step " + (i + 1) })), { label: "Summary", n: "Finish" }];
    items.forEach((it, idx) => {
      const unlocked = idx <= S.furthest + (idx === 6 && allPicked() ? 0 : 0);
      const reach = idx === 0 || (idx <= 5 && idx <= S.furthest) || (idx === 6 && allPicked());
      const done = idx === 0 ? hasPlan() : idx <= 5 ? S.picks[STAGES[idx - 1].key] != null : S.stage === 6;
      const pick = idx >= 1 && idx <= 5 && S.picks[STAGES[idx - 1].key] != null ? (S.options[STAGES[idx - 1].key] || [])[S.picks[STAGES[idx - 1].key]] : null;
      const sub = idx === 0 ? (hasPlan() ? S.brief.dest : "Required first") : pick ? pick.name : (idx === 6 ? "All picks" : "");
      const btn = el("button", { type: "button", disabled: !reach || busy, "aria-current": S.stage === idx ? "step" : null, onclick: () => go(idx) },
        el("span", { class: "n", text: done && idx !== 6 ? "✓ " + it.n : it.n }),
        el("span", { class: "l", text: it.label }),
        el("span", { class: "p", text: sub }));
      box.append(el("li", { class: "step" + (S.stage === idx ? " cur" : "") + (done ? " done" : "") }, btn));
    });
  }
  const hasPlan = () => !S.example && Object.keys(S.options).length > 0 || S.example;
  const allPicked = () => STAGES.every((s) => S.picks[s.key] != null);

  function go(idx) {
    if (busy) return;
    S.stage = idx; setStatus(""); render();
    if (idx >= 1 && idx <= 5 && !S.options[STAGES[idx - 1].key]) generate(STAGES[idx - 1].key);
  }

  // ---------- discovery ----------
  function renderDiscovery() {
    const b = S.brief;
    const form = el("form", { class: "form", novalidate: true, onsubmit: (e) => { e.preventDefault(); startPlanning(); } });
    const dest = el("input", { type: "text", id: "dest", value: b.dest, placeholder: "e.g. Kyoto, Japan", autocomplete: "off" });
    const origin = el("input", { type: "text", id: "origin", value: b.origin, placeholder: "e.g. Tel Aviv", autocomplete: "off" });
    const start = el("input", { type: "date", id: "start", value: b.start });
    const end = el("input", { type: "date", id: "end", value: b.end });
    const cur = el("select", { id: "cur", "aria-label": "Currency" }, ["USD", "EUR", "GBP", "ILS", "CAD", "AUD", "JPY"].map((c) => el("option", { text: c, selected: c === b.cur })));
    const budget = el("input", { type: "number", id: "budget", min: "0", step: "50", value: b.budget, placeholder: "Total for everyone", "aria-label": "Overall budget" });
    const nightsEl = el("div", { class: "nights" });
    const modeSeg = el("div", { class: "seg", role: "radiogroup", "aria-label": "Budget type" },
      ...[["total", "One overall budget"], ["category", "Budget per category"]].flatMap(([v, t]) => [
        el("input", { type: "radio", name: "bmode", id: "bm-" + v, value: v, checked: b.budgetMode === v }),

    if (!S.id) return; store.set(store.get().filter((t) => t.id !== S.id)); delete S.id; refreshSaved(""); $("#delBtn").hidden = true; setStatus("Removed from saved trips.");
  });

  // ---------- boot ----------
  S = exampleState(); refreshSaved(""); render();
  setStatus("Connecting to the agent…");
  (async () => {
    try { sampleFn = window.claude ? await window.claude.use("sample") : null; } catch { sampleFn = null; }
    if (sampleFn) { setStatus(""); if (!busy) { const f = $("#stage form"); if (f && f._validate) f._validate(); else render(); } }
    else { setStatus("The AI agent isn't available in this view. You can still look around the example trip.", true); render(); }
  })();
})();
</script>
